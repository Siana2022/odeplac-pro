<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1e3d6b" />
  <title>Sin conexión · ODEPLAC PRO</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100dvh; padding: 24px;
      display: flex; align-items: center; justify-content: center;
      background: #1e3d6b; color: #fff;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    .card {
      width: 100%; max-width: 460px; text-align: center;
      background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.12);
      border-radius: 32px; padding: 40px 28px;
      box-shadow: 0 24px 60px rgba(0,0,0,.35);
    }
    .logo { font-size: 26px; font-weight: 900; font-style: italic; letter-spacing: -.02em; text-transform: uppercase; }
    .logo span { color: #34d399; }
    .sub { font-size: 10px; letter-spacing: .3em; text-transform: uppercase; color: rgba(255,255,255,.45); margin-top: 6px; }
    .icon { margin: 28px auto 18px; width: 64px; height: 64px; border-radius: 22px; background: rgba(52,211,153,.12); display: flex; align-items: center; justify-content: center; }
    h1 { font-size: 22px; font-weight: 900; font-style: italic; text-transform: uppercase; margin: 0 0 10px; }
    p { font-size: 14px; line-height: 1.55; color: rgba(255,255,255,.65); margin: 0 0 24px; }
    button {
      width: 100%; min-height: 52px; border: 0; border-radius: 18px; cursor: pointer;
      background: #34d399; color: #0f172a; font-size: 13px; font-weight: 900;
      text-transform: uppercase; letter-spacing: .08em;
    }
    button:active { transform: scale(.98); }
    .hint { margin-top: 18px; font-size: 11px; color: rgba(255,255,255,.35); }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">ODEPLAC <span>PRO</span></div>
    <div class="sub">Construcciones en seco</div>

    <div class="icon" aria-hidden="true">
      <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#34d399" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M2 2l20 20" />
        <path d="M8.5 16.5a5 5 0 0 1 7 0" />
        <path d="M2 8.8a15 15 0 0 1 4.2-2.7" />
        <path d="M10.7 5.1A15 15 0 0 1 22 8.8" />
        <path d="M5 12.5a10 10 0 0 1 3-1.9" />
        <path d="M16 10.6a10 10 0 0 1 3 1.9" />
        <path d="M12 20h.01" />
      </svg>
    </div>

    <h1>Sin conexión</h1>
    <p>
      No hay internet y esta pantalla todavía no está guardada en el dispositivo.
      Ábrela una vez con cobertura y a partir de ahí podrás consultarla sin red.
    </p>

    <button onclick="location.reload()">Reintentar</button>
    <p class="hint">Los cambios que hagas sin conexión se enviarán solos al recuperar la cobertura.</p>
  </div>

  <script>
    window.addEventListener('online', () => {
      document.querySelector('button').textContent = 'Conexión recuperada · Abrir';
      setTimeout(() => location.reload(), 600);
    });
  </script>
</body>
</html>
